

services:
  codebase-engineer:
    build:

      context: /home/opc/codebase-engineer
      dockerfile: deploy/Dockerfile
      args:

        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    image: codebase-engineer:latest
    ports:
      - "4000:4000"
    volumes:
      - codebase-engineer-data:/data
      - ./repos:/repos:ro
    environment:

      - AUTH_TOKEN_ENCRYPTION_KEY=${AUTH_TOKEN_ENCRYPTION_KEY:-}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - DODO_PAYMENTS_API_KEY=${DODO_PAYMENTS_API_KEY:-}
      - DODO_PAYMENTS_WEBHOOK_KEY=${DODO_PAYMENTS_WEBHOOK_KEY:-}
      - DODO_PRODUCT_ID=${DODO_PRODUCT_ID:-}
      - DODO_PAYMENTS_ENVIRONMENT=${DODO_PAYMENTS_ENVIRONMENT:-}
      - DODO_API_BASE_URL=${DODO_API_BASE_URL:-}
      - DODO_RETURN_URL=${DODO_RETURN_URL:-}
    restart: unless-stopped

volumes:
  codebase-engineer-data:
